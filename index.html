<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f9dce8">
  <title>The Ultimate Beginning ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="fairy-lights" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="hearts" aria-hidden="true">
    <span>♡</span><span>♥</span><span>♡</span><span>♥</span>
    <span>♡</span><span>♥</span><span>♡</span>
  </div>

  <main class="container">

    <section class="quote-section">
      <div class="small-heart">♡</div>

      <p class="quote">
        Take my hand<br>
        Take my whole life, too<br>
        For I can't help<br>
        Falling in love with you
      </p>

      <div class="quote-line">♡──────────♡</div>
    </section>

    <section class="countdown-card">

      <div class="countdown-title">
        <span>♥</span> COUNTDOWN TO <span>♥</span>
      </div>

      <h1>the ultimate beginning</h1>

      <div class="divider">♡</div>

      <div class="date">09 SEPTEMBER 2026</div>

      <div class="timer">
        <div class="time-box">
          <strong id="days">00</strong>
          <small>DAYS</small>
        </div>

        <div class="time-box">
          <strong id="hours">00</strong>
          <small>HOURS</small>
        </div>

        <div class="time-box">
          <strong id="minutes">00</strong>
          <small>MINUTES</small>
        </div>

        <div class="time-box">
          <strong id="seconds">00</strong>
          <small>SECONDS</small>
        </div>
      </div>

    </section>

    <section class="bottom-area" aria-hidden="true">
      <div class="gift">🎁<span>For You</span></div>
      <div class="love-heart">💗</div>
      <div class="lock">🔐</div>
      <div class="candle">🕯️</div>
    </section>

    <section id="final-message" class="final-message">
      <div class="final-heart">♥</div>
      <h2>Our story begins today ♡</h2>
      <p>And this is only the beginning...</p>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
